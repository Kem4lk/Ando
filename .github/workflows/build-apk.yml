name: Build debug APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ando-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-${{ github.run_id }}"
          cp app/build/outputs/apk/debug/app-debug.apk "ando-${{ github.run_number }}.apk"
          gh release create "$tag" "ando-${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" \
            --title "Ando debug APK (run ${{ github.run_number }})" \
            --notes "Automated debug build from ${{ github.sha }}." \
            --prerelease
